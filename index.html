<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặc Sản Tây Nguyên</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="header-container">

            <div class="logo">
                <h1>Đặc Sản Tây Nguyên</h1>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Tìm kiếm sản phẩm..."
                >
            </div>

            <div class="cart">
                🛒 Giỏ hàng:
                <span id="cart-count">0</span>
            </div>

        </div>
    </header>


    <!-- NỘI DUNG CHÍNH -->
    <main>

        <!-- GIỚI THIỆU -->
        <section class="hero">
            <h2>Đặc Sản Tây Nguyên</h2>

            <p>
                Khám phá những sản phẩm đặc sản chất lượng
                đến từ vùng đất Tây Nguyên.
            </p>
        </section>


        <!-- BỘ LỌC -->
        <section class="filter-section">

            <h2>Danh sách sản phẩm</h2>

            <select id="category-filter">
                <option value="all">Tất cả sản phẩm</option>
                <option value="ca-phe">Cà phê</option>
                <option value="mat-ong">Mật ong</option>
                <option value="mac-ca">Mắc ca</option>
                <option value="tieu">Hồ tiêu</option>
                <option value="bo">Bơ sáp</option>
                <option value="tho-cam">Thổ cẩm</option>
            </select>

        </section>


        <!-- DANH SÁCH SẢN PHẨM -->
        <section id="product-list">

            <!--
                Sản phẩm sẽ được JavaScript
                tự động hiển thị tại đây
            -->

        </section>


        <!-- FORM ĐẶT HÀNG -->
        <section class="order-section">

            <h2>Thông tin đặt hàng</h2>

            <form id="order-form">

                <div class="form-group">
                    <label for="customer-name">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Nhập họ và tên"
                    >
                </div>


                <div class="form-group">
                    <label for="phone">
                        Số điện thoại
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Nhập số điện thoại"
                    >
                </div>


                <div class="form-group">
                    <label for="address">
                        Địa chỉ nhận hàng
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Nhập địa chỉ nhận hàng"
                    >
                </div>


                <div class="form-group">
                    <label for="note">
                        Ghi chú
                    </label>

                    <textarea
                        id="note"
                        placeholder="Nhập ghi chú nếu có"
                    ></textarea>
                </div>


                <button type="submit">
                    Gửi đơn hàng
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 Hệ thống giới thiệu và kinh doanh
            sản phẩm đặc sản Tây Nguyên
        </p>

    </footer>


    <!-- KẾT NỐI JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
